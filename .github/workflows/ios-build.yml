name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios/TotemOS

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 16.3
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Install XcodeGen
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output /tmp/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  /tmp/xcodegen.zip" \
            | shasum --algorithm 256 --check
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-release

      - name: Generate Xcode project
        run: /tmp/xcodegen-release/xcodegen/bin/xcodegen generate

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project TotemOS.xcodeproj
          -scheme TotemOS
          -configuration Debug
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Run unit tests
        run: |
          destinations="$(
            xcodebuild \
              -project TotemOS.xcodeproj \
              -scheme TotemOS \
              -showdestinations
          )"
          printf '%s\n' "$destinations"

          simulator_id="$(
            printf '%s\n' "$destinations" \
              | sed -nE '/platform:iOS Simulator/ s/.*id:([0-9A-Fa-f-]{36}),.*/\1/p' \
              | head -n 1 \
              | xargs
          )"

          if [[ -z "$simulator_id" ]]; then
            echo "No available iOS Simulator destination was reported by Xcode." >&2
            exit 1
          fi

          set +e
          set -o pipefail
          xcodebuild \
            -project TotemOS.xcodeproj \
            -scheme TotemOS \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee /tmp/totem-ios-tests.log
          test_status="${PIPESTATUS[0]}"
          set -e

          if [[ "$test_status" -ne 0 ]]; then
            diagnostic="$(
              { grep -E 'error:|failed|Failure|Unable to|timed out' \
                  /tmp/totem-ios-tests.log || true; } \
                | tail -n 1 \
                | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g'
            )"
            if [[ -z "$diagnostic" ]]; then
              diagnostic="xcodebuild exited with status $test_status"
            fi
            echo "::error title=iOS unit tests::$diagnostic"
            exit "$test_status"
          fi
