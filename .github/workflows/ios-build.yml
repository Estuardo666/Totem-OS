name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios/TotemOS

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the newest Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$newest" ]; then
            newest=/Applications/Xcode.app
          fi
          echo "Selecting $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output /tmp/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  /tmp/xcodegen.zip" \
            | shasum --algorithm 256 --check
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-release

      - name: Generate Xcode project
        run: /tmp/xcodegen-release/xcodegen/bin/xcodegen generate

      - name: Prepare iOS simulator runtime
        run: |
          xcodebuild -version
          if ! xcrun simctl list runtimes | grep -q "iOS 26"; then
            echo "iOS 26 runtime is not installed; downloading the current platform."
            xcodebuild -downloadPlatform iOS
          fi
          xcrun simctl list runtimes

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project TotemOS.xcodeproj
          -scheme TotemOS
          -configuration Debug
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Select iPhone simulator
        id: simulator
        run: |
          udid="$(
            xcrun simctl list devices available --json \
              | /usr/bin/python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted(
              (key for key in devices if ".iOS-" in key),
              key=lambda key: tuple(map(int, re.findall(r"\d+", key))),
              reverse=True,
          )
          for runtime in runtimes:
              for device in devices[runtime]:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          '
          )"

          if [ -z "$udid" ]; then
            echo "::error title=iOS unit tests::No available iPhone simulator on the runner."
            xcrun simctl list devices available
            exit 1
          fi

          echo "Selected simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Boot simulator
        run: |
          udid="${{ steps.simulator.outputs.udid }}"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      - name: Build for testing
        run: >-
          xcodebuild
          -project TotemOS.xcodeproj
          -scheme TotemOS
          -destination "id=${{ steps.simulator.outputs.udid }}"
          CODE_SIGNING_ALLOWED=NO
          build-for-testing

      - name: Run unit tests
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project TotemOS.xcodeproj \
            -scheme TotemOS \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building 2>&1 | tee /tmp/totem-ios-tests.log
          test_status="${PIPESTATUS[0]}"
          set -e

          if [ "$test_status" -ne 0 ]; then
            {
              grep -A 6 'Testing failed:' /tmp/totem-ios-tests.log || true
              grep -E 'error:|XCTAssert|crashed|Undefined symbol|cannot find' /tmp/totem-ios-tests.log || true
              grep -v '^[[:space:]]*$' /tmp/totem-ios-tests.log | tail -n 6
            } \
              | grep -v '^[[:space:]]*$' \
              | awk '!seen[$0]++' \
              | head -n 9 \
              | sed 's/%/%25/g' \
              | while IFS= read -r line; do
                  echo "::error title=iOS unit tests::$line"
                done
            echo "----- tail of xcodebuild log -----"
            tail -n 120 /tmp/totem-ios-tests.log

            echo "----- crash reports -----"
            report="$(grep -rl TotemOS ~/Library/Logs/DiagnosticReports 2>/dev/null | head -n 1)"
            if [ -n "$report" ]; then
              head -n 60 "$report"
              { grep -E 'Fatal error|termination|Exception|abort' "$report" || true; } \
                | head -n 4 \
                | sed 's/%/%25/g' \
                | while IFS= read -r line; do
                    echo "::error title=iOS crash::$line"
                  done
            else
              echo "No crash report found."
            fi
            echo "::error title=iOS unit tests::xcodebuild exited with status $test_status"
            exit "$test_status"
          fi

          echo "----- test summary -----"
          { grep -E "Executed [0-9]+ test|Test Suite .* (passed|failed)" /tmp/totem-ios-tests.log || true; } \
            | tail -n 6

          executed="$(
            sed -nE 's/.*Executed ([0-9]+) tests?.*/\1/p' /tmp/totem-ios-tests.log \
              | sort -rn \
              | head -n 1
          )"
          if [ -z "$executed" ] || [ "$executed" -eq 0 ]; then
            echo "::error title=iOS unit tests::xcodebuild reported no executed tests."
            exit 1
          fi
          echo "Executed $executed test(s)."

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-test-log
          path: /tmp/totem-ios-tests.log
          if-no-files-found: warn
