name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios/TotemOS

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output /tmp/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  /tmp/xcodegen.zip" \
            | shasum --algorithm 256 --check
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-release

      - name: Generate Xcode project
        run: /tmp/xcodegen-release/xcodegen/bin/xcodegen generate

      - name: Prepare iOS simulator runtime
        run: |
          xcodebuild -version
          if ! xcrun simctl list runtimes | grep -q "iOS "; then
            echo "No iOS runtime installed; downloading."
            xcodebuild -downloadPlatform iOS
          fi
          xcrun simctl list runtimes

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project TotemOS.xcodeproj
          -scheme TotemOS
          -configuration Debug
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Select iPhone simulator
        id: simulator
        run: |
          udid="$(
            xcrun simctl list devices available \
              | sed -nE '/^-- iOS /,/^-- /p' \
              | sed -nE 's/^ *iPhone[^(]*\(([0-9A-Fa-f-]{36})\).*/\1/p' \
              | head -n 1
          )"

          if [ -z "$udid" ]; then
            echo "::error title=iOS unit tests::No available iPhone simulator on the runner."
            xcrun simctl list devices available
            exit 1
          fi

          echo "Selected simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Boot simulator
        run: |
          udid="${{ steps.simulator.outputs.udid }}"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      - name: Run unit tests
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project TotemOS.xcodeproj \
            -scheme TotemOS \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee /tmp/totem-ios-tests.log
          test_status="${PIPESTATUS[0]}"
          set -e

          if [ "$test_status" -ne 0 ]; then
            diagnostic="$({ grep -E 'error:|failed|Failure|Unable to|timed out' /tmp/totem-ios-tests.log || true; } | tail -n 1 | sed 's/%/%25/g')"
            if [ -z "$diagnostic" ]; then
              diagnostic="xcodebuild exited with status $test_status"
            fi
            echo "::error title=iOS unit tests::$diagnostic"
            exit "$test_status"
          fi
