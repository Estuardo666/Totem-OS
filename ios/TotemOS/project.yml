name: TotemOS

options:
  bundleIdPrefix: com.totemmassmedia
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.3"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  TotemOS:
    type: application
    platform: iOS
    sources:
      - path: TotemOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: TotemOS/Info.plist
      properties:
        CFBundleDisplayName: Totem OS
        LSApplicationCategoryType: public.app-category.business
        TOTEM_BASE_URL: https://totem-os.vercel.app
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.totemmassmedia.totemos
        PRODUCT_MODULE_NAME: TotemOS
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: TotemOS/Resources/TotemOS.entitlements
  TotemOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TotemOSTests
    dependencies:
      - target: TotemOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TotemOS:
    build:
      targets:
        TotemOS: all
        TotemOSTests: [test]
    test:
      targets:
        - TotemOSTests
