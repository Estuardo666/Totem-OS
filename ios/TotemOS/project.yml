name: TotemOS

configs:
  Debug: debug
  DebugFree: debug
  Release: release

options:
  bundleIdPrefix: com.totemmassmedia
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.3"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  TotemOSKit:
    type: framework
    platform: iOS
    sources:
      - path: TotemOSKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.totemmassmedia.totemos.kit
        PRODUCT_MODULE_NAME: TotemOSKit
        GENERATE_INFOPLIST_FILE: YES

  TotemOS:
    type: application
    platform: iOS
    sources:
      - path: TotemOS
    dependencies:
      - target: TotemOSKit
    configFiles:
      Debug: Config/Debug.xcconfig
      DebugFree: Config/DebugFree.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: TotemOS/Info.plist
      properties:
        CFBundleDisplayName: Totem OS
        LSApplicationCategoryType: public.app-category.business
        TOTEM_BASE_URL: https://totem-os.vercel.app
        UIApplicationSupportsIndirectInputEvents: true
        UIAppFonts:
          - GoogleSans-Regular.ttf
          - GoogleSans-Medium.ttf
          - GoogleSans-Bold.ttf
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.totemmassmedia.totemos
        PRODUCT_MODULE_NAME: TotemOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_DEBUG_DYLIB: NO
        GENERATE_INFOPLIST_FILE: NO
  TotemOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TotemOSTests
      - path: ../../contracts/fixtures
        buildPhase: resources
    dependencies:
      - target: TotemOSKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TotemOS:
    build:
      targets:
        TotemOSKit: all
        TotemOS: all
        TotemOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TotemOSTests

  TotemOS (sin push):
    build:
      targets:
        TotemOSKit: all
        TotemOS: all
    run:
      config: DebugFree
