name: TotemOS

options:
  bundleIdPrefix: com.totemmassmedia
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.3"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  TotemOS:
    type: application
    platform: iOS
    sources:
      - path: TotemOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.totemmassmedia.totemos
        PRODUCT_MODULE_NAME: TotemOS
        PRODUCT_NAME: Totem OS
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Totem OS
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_TOTEM_BASE_URL: https://totem-os.vercel.app
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: TotemOS/Resources/TotemOS.entitlements
  TotemOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TotemOSTests
    dependencies:
      - target: TotemOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TotemOS:
    build:
      targets:
        TotemOS: all
        TotemOSTests: [test]
    test:
      targets:
        - TotemOSTests
